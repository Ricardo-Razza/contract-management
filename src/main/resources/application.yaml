spring:
  datasource:
    url: jdbc:mysql://banco-arp-contract-management.g.aivencloud.com:20894/contract-management?useSSL=true&requireSSL=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
    username: avnadmin
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        trustStore: classpath:truststore.jks
        trustStorePassword: changeit
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

server:
  port: 8081
  servlet:
    context-path: /api
