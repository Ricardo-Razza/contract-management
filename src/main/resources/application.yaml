spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    open-in-view: false

server:
  port: ${PORT:8081}
  address: 0.0.0.0
  servlet:
    context-path: /api

logging:
  level:
    com.contract_management: ${LOG_LEVEL:DEBUG}